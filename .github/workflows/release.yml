name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    name: Build and publish macOS release
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Build release executable
        run: make build

      - name: Run Swift package tests
        run: swift test

      - name: Package release asset
        id: package
        run: |
          architecture="$(uname -m)"
          asset_name="outlook-ax-macos-${architecture}.tar.gz"
          package_dir="outlook-ax-macos-${architecture}"
          mkdir -p "dist/${package_dir}"
          cp outlook-ax "dist/${package_dir}/"
          cp README.md LICENSE "dist/${package_dir}/"
          tar -C dist -czf "dist/${asset_name}" "${package_dir}"
          echo "asset_name=${asset_name}" >> "$GITHUB_OUTPUT"
          echo "package_dir=${package_dir}" >> "$GITHUB_OUTPUT"

      - name: Smoke-test packaged executable
        run: |
          mkdir smoke-test
          tar -xzf "dist/${{ steps.package.outputs.asset_name }}" -C smoke-test
          "./smoke-test/${{ steps.package.outputs.package_dir }}/outlook-ax" --help

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          generate_release_notes: true
          files: dist/${{ steps.package.outputs.asset_name }}