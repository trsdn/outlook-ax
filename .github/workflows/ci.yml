name: CI

on:
  push:
    branches: [main, "feature/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build, test, and validate
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Build release executable
        run: make build

      - name: Run Swift package tests
        run: swift test

      - name: Smoke-test CLI help
        run: ./outlook-ax --help

      - name: Check repository layout
        run: bash scripts/check-repository-layout.sh

      - name: Check architecture
        run: bash scripts/check-architecture.sh
